server {
    listen 2053 ssl;
    server_name 107.172.32.153;
    ssl_certificate /root/.acme.sh/107.172.32.153_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/107.172.32.153_ecc/107.172.32.153.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/ziwei-api-location.conf;
    root /var/www/ziwei;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location ~ /\. { deny all; }
}
